<style>
  :root{
    --green: #33421f;
    --green-dark: #232e15;
    --gold: #c9a34d;
    --gold-light: #e4c878;
    --beige: #f4efe1;
    --white: #ffffff;
    --ink: #2a2a22;
    --muted: #7a7462;
    --orange: #e8590c;
    --yellow: #f2b705;
    --vert-ok: #2f7d32;
    --radius: 14px;
    --shadow: 0 4px 18px rgba(51,66,31,0.12);
    --on-green:#ffffff; --on-gold:#232e15;
    --line:#eee3c8; --line2:#ddd3ba; --line3:#f0e8d0; --line4:#cfc5a8; --panel2:#faf5e6; --panel3:#fffdf7;
    --err-bg:#fbe6e0; --danger-text:#8f3821; --ok-bg:#e7f0e3; --toast-bg:#232e15; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --green:#93b36a; --green-dark:#dfe9c8; --beige:#14180f; --white:#1f2517; --ink:#ece7d6; --muted:#a8a28c;
      --on-green:#141a0d; --on-gold:#232e15;
      --line:#343c28; --line2:#454e37; --line3:#2b3220; --line4:#5a6349; --panel2:#262d1c; --panel3:#1b2114;
      --err-bg:#3b1f18; --danger-text:#f0a58f; --ok-bg:#25341e; --toast-bg:#39442a; --vert-ok:#5fb063;
      --shadow:0 4px 18px rgba(0,0,0,.4); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
      --green:#93b36a; --green-dark:#dfe9c8; --beige:#14180f; --white:#1f2517; --ink:#ece7d6; --muted:#a8a28c;
      --on-green:#141a0d; --on-gold:#232e15;
      --line:#343c28; --line2:#454e37; --line3:#2b3220; --line4:#5a6349; --panel2:#262d1c; --panel3:#1b2114;
      --err-bg:#3b1f18; --danger-text:#f0a58f; --ok-bg:#25341e; --toast-bg:#39442a; --vert-ok:#5fb063;
      --shadow:0 4px 18px rgba(0,0,0,.4); color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--beige);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #app{max-width:900px;margin:0 auto;min-height:100%;padding:0 16px 40px;}
  a{color:inherit;text-decoration:none;}
  button, select, input, textarea{font-family:inherit;font-size:15px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--green);color:var(--on-green);border:none;border-radius:10px;
    padding:12px 18px;cursor:pointer;font-weight:600;transition:.15s;
  }
  .btn:hover{background:var(--green-dark);}
  .btn.gold{background:var(--gold);color:var(--on-gold);}
  .btn.gold:hover{background:var(--gold-light);}
  .btn.outline{background:transparent;color:var(--green);border:1.5px solid var(--green);}
  .btn.danger{background:#b3462c;}
  .btn.danger:hover{background:#8f3821;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:600;font-size:13px;color:var(--green-dark);margin-bottom:6px;}
  .field input[type=text], .field input[type=email], .field input[type=password],
  .field select, .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line2);border-radius:10px;
    background:var(--white);color:var(--ink);
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--gold);
  }
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:44px;}
  .password-toggle{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;font-size:13px;font-weight:600;
  }
  .card-box{
    background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:16px;
  }
  .auth-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px 16px;
  }
  .auth-logo{width:90px;height:90px;object-fit:contain;margin-bottom:10px;}
  .auth-title{font-weight:800;color:var(--green-dark);font-size:22px;margin:0 0 4px;text-align:center;}
  .auth-sub{color:var(--muted);font-size:14px;margin:0 0 22px;text-align:center;}
  .auth-card{width:100%;max-width:400px;}
  .auth-switch{text-align:center;margin-top:14px;font-size:14px;color:var(--muted);}

function h(str){ // échappement HTML sûr pour le texte ET les attributs (guillemets inclus)
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
// Validation stricte des paramètres lus dans l'URL (#/jour/..., #/fiche/...)
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function isValidDateStr(s){
  if (!DATE_RE.test(s || "")) return false;
  const [y, m, d] = s.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
// N'accepte que les liens http(s) (bloque javascript:, data:, etc.)
function safeHttpUrl(u){
  try {
    const url = new URL(String(u || "").trim());
    return (url.protocol === "https:" || url.protocol === "http:") ? url.href : null;
  } catch(e) { return null; }
}
function friendlyError(message){
  if (message === "Failed to fetch") {
    return "Impossible de joindre Supabase. Vérifiez : 1) que SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier sont bien ceux de votre projet, 2) que votre projet Supabase n'est pas en pause, 3) votre connexion internet.";
  }
  return message;
}
function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

let previousHash = location.hash;
let ficheDirtyCheck = null; // fonction qui renvoie true s'il y a des modifications non enregistrées sur la fiche affichée
let suppressGuard = false;

window.addEventListener("hashchange", () => {
  if (!suppressGuard && ficheDirtyCheck && ficheDirtyCheck()) {
    const ok = confirm("Vous avez des modifications non enregistrées sur cette fiche. Quitter sans enregistrer ?");
    if (!ok) {
      suppressGuard = true;
      location.hash = previousHash;
      suppressGuard = false;
      return;
    }
  }
  previousHash = location.hash;
  ficheDirtyCheck = null;
  route();
});
window.addEventListener("beforeunload", (e) => {
  if (ficheDirtyCheck && ficheDirtyCheck()) {
    e.preventDefault();
    e.returnValue = "";
  }
});
window.addEventListener("DOMContentLoaded", init);

function setupPwa(){
  syncThemeColor();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => { /* facultatif */ });
  }
}

async function init(){
  setupPwa();
  const { data } = await supabaseClient.auth.getSession();
  state.session = data.session;
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    state.session = session;
  });
  if (state.session) await loadProfile();
  route();
}

async function route(){
  const hash = location.hash || "#/";
  // Pages légales : accessibles avec ou sans connexion
  if (hash === "#/mentions-legales") return renderLegal("mentions");
  if (hash === "#/confidentialite") return renderLegal("privacy");
  if (hash === "#/cgu") return renderLegal("cgu");
  if (!state.session) {
    if (hash.startsWith("#/signup")) return renderSignup();
    return renderLogin();
  }
  if (!state.profile) await loadProfile();
  // Comptes créés avant les CGU : acceptation demandée une fois
  if (state.termsOkFor !== state.session.user.id && !state.session.user.user_metadata?.terms_accepted_at) return renderTermsGate();

  if (hash === "#/" || hash === "") return renderHome();
  if (hash.startsWith("#/jour/")) {
    const ds = hash.slice("#/jour/".length);
    if (!isValidDateStr(ds)) { location.hash = "#/"; return; }
    return renderDay(ds);
  }
  if (hash.startsWith("#/fiche/nouvelle/")) {
    const ds = hash.slice("#/fiche/nouvelle/".length);
    if (!isValidDateStr(ds)) { location.hash = "#/"; return; }
    return renderFiche(null, ds);
  }
  if (hash.startsWith("#/fiche/")) {
    const id = hash.slice("#/fiche/".length);
    if (!UUID_RE.test(id)) { location.hash = "#/"; return; }
    return renderFiche(id);
  }
  if (hash === "#/profil") return renderProfile();
  if (hash === "#/admin") return renderAdmin();
  if (hash === "#/a-faire") return renderTodoList();
  if (hash === "#/corbeille") return renderTrash();
  if (hash === "#/recherche") return renderSearch();
  if (hash === "#/clients") return renderClients();
  renderHome();
}

async function loadProfile(){
  const uid = state.session.user.id;
  let { data } = await supabaseClient.from("profiles").select("*").eq("id", uid).maybeSingle();
  if (!data) {
    const { data: created } = await supabaseClient.from("profiles")
      .insert({ id: uid, full_name: (state.session.user.user_metadata?.full_name || "").trim() || state.session.user.email.split("@")[0] })
      .select().single();
    data = created;
  }
  state.profile = data;
  if (data.is_cm) {
    try {
      const saved = localStorage.getItem(`made_current_client_${uid}`);
      if (saved) {
        const { data: cl } = await supabaseClient.from("clients").select("id,name,status").eq("id", saved).maybeSingle();
        if (cl && cl.status === "actif") {
          state.currentClientId = cl.id;
          state.currentClientName = cl.name;
        } else {
          state.currentClientId = null;
          state.currentClientName = null;
        }
      }
    } catch(e) { /* localStorage indisponible */ }
  }
}

/* ---------------- TURNSTILE (captcha) ---------------- */
function isTurnstileConfigured(){
  const k = window.MADE_CONFIG.TURNSTILE_SITE_KEY || "";
  return !!k && !k.startsWith("VOTRE");
}
function mountTurnstile(){
  const el = document.getElementById("turnstile-box");
  if (!el) return;
  el.innerHTML = "";
  state.turnstileWidgetId = null;
  if (!isTurnstileConfigured()) return; // pas de clé réelle configurée -> pas de captcha à afficher
  let attempts = 0;
  const tryRender = () => {
    if (window.turnstile) {
      state.turnstileWidgetId = window.turnstile.render(el, {
        sitekey: window.MADE_CONFIG.TURNSTILE_SITE_KEY,
        theme: "light"
      });
    } else if (attempts < 40) {
      attempts++;
      setTimeout(tryRender, 150); // le script Turnstile charge en différé, on patiente
    } else {
      el.innerHTML = `<div class="error-msg">Le captcha n'a pas pu se charger.</div>`;
    }
  };
  tryRender();
}
function getTurnstileToken(){
  if (!window.turnstile || state.turnstileWidgetId === null) return "";
  return window.turnstile.getResponse(state.turnstileWidgetId) || "";
}
function resetTurnstile(){
  try { if (window.turnstile && state.turnstileWidgetId !== null) window.turnstile.reset(state.turnstileWidgetId); }
  catch(e) { /* rien à faire */ }
}

/* ---------------- CONDITIONS DU MOT DE PASSE ---------------- */
// Mêmes jeux de caractères que ceux comptés par Supabase (Password requirements),
// pour qu'un mot de passe accepté ici ne soit pas refusé côté serveur.
const PW_RULES = [
  { label: "8 caractères minimum",                   test: p => p.length >= 8 },
  { label: "Une majuscule (A-Z)",                     test: p => /[A-Z]/.test(p) },
  { label: "Une minuscule (a-z)",                     test: p => /[a-z]/.test(p) },
  { label: "Un chiffre (0-9)",                        test: p => /[0-9]/.test(p) },
  { label: "Un caractère spécial (! @ # $ % & * …)",  test: p => /[!@#$%^&*()_+\-=\[\]{};':"\\|<>?,.\/`~]/.test(p) }
];
function passwordIsValid(p){ return PW_RULES.every(r => r.test(p || "")); }
// Affiche la liste sous le champ et coche chaque condition dès qu'elle est remplie
function wirePasswordRules(inputId, listId){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  list.innerHTML = PW_RULES.map(r => `<li><span class="pw-ico"></span><span>${h(r.label)}</span></li>`).join("");
  const items = list.querySelectorAll("li");
  const update = () => {
    PW_RULES.forEach((r, i) => items[i].classList.toggle("ok", r.test(input.value)));
  };
  input.addEventListener("input", update);
  update();
}

function wirePasswordToggles(){
  document.querySelectorAll(".password-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.textContent = showing ? "Afficher" : "Masquer";
    });
  });
}

// Filtre une requête sur content_cards pour ne renvoyer que celles du calendrier actif
// (calendrier personnel si aucun Client n'est sélectionné, sinon celui du Client en cours)
function scopeToCurrentCalendar(query){
  return state.currentClientId
    ? query.eq("client_id", state.currentClientId)
    : query.is("client_id", null);
}

async function loadMonthCards(){
  const y = state.viewYear, m = state.viewMonth;
  const from = fmtDate(y, m, 1);
  const lastDay = new Date(y, m+1, 0).getDate();
  const to = fmtDate(y, m, lastDay);
  let query = supabaseClient
    .from("content_cards")
    .select("id, card_date, status, platform, image_url, post_time")
    .is("deleted_at", null)
    .gte("card_date", from)
    .lte("card_date", to);
  query = scopeToCurrentCalendar(query);
  const { data, error } = await query;
  state.monthCards = error ? [] : (data || []);
}

const DOT_COLOR = { a_faire: "var(--orange)", programme: "var(--yellow)", publie: "var(--vert-ok)" };
const STATUS_ORDER = ["a_faire", "programme", "publie"];

async function renderHome(){
  if (state.viewMode !== "month") return renderRangeView();
  app.innerHTML = topbarHTML() + `<div id="cal-wrap" class="center"><div class="spinner"></div></div>`;
  await loadMonthCards();

  const y = state.viewYear, m = state.viewMonth;
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7; // lundi=0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const todayStr = fmtDate(today.getFullYear(), today.getMonth(), today.getDate());

  const cardsByDay = {};
  state.monthCards.forEach(c => {
    if (!cardsByDay[c.card_date]) cardsByDay[c.card_date] = [];
    cardsByDay[c.card_date].push(c);
  });

  function pickRepresentative(cards){
    // priorité : une fiche avec photo, la plus tôt dans la journée
    const sorted = cards.slice().sort((a,b) => (a.post_time||"99:99").localeCompare(b.post_time||"99:99"));
    return sorted.find(c => c.image_url) || sorted[0];
  }

  function dayClass(cards){
    if (!cards || !cards.length) return "";
    const set = new Set(cards.map(c => c.status));
    if (set.has("a_faire")) return "status-orange";
    if (set.has("programme")) return "status-yellow";
    return "status-green";
  }

  let cells = "";
  for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = fmtDate(y, m, d);
    const cards = cardsByDay[dateStr];
    const isToday = dateStr === todayStr;

    if (cards && cards.length) {
      const rep = pickRepresentative(cards);
      const icon = PLATFORM_ICON[rep.platform] || PLATFORM_ICON["Autre"];
      const badgeColor = DOT_COLOR[rep.status];
      const otherStatuses = STATUS_ORDER.filter(s => s !== rep.status && cards.some(c => c.status === s));
      cells += `
        <div class="cal-day has-thumb ${isToday ? "today":""}" style="border:2.5px solid ${badgeColor};" data-drop-date="${dateStr}" ${cards.length === 1 ? `data-drag-card="${h(rep.id)}" data-drag-date="${dateStr}"` : `data-drag-multi="1"`} onclick="location.hash='#/jour/${dateStr}'">
          ${rep.image_url ? `<img class="thumb-bg" src="${h(rep.image_url)}">` : `<div class="thumb-bg thumb-bg-empty"></div>`}
          <span class="num">${d}</span>
          ${cards.length > 1 ? `<span class="count-badge">${cards.length}</span>` : ""}
          <span class="platform-badge" style="background:${badgeColor}"><i class="${icon}"></i></span>
          ${otherStatuses.length ? `<span class="dots">${otherStatuses.map(s => `<span class="dot" style="background:${DOT_COLOR[s]}"></span>`).join("")}</span>` : ""}
        </div>`;
    } else {
      cells += `
        <div class="cal-day ${isToday ? "today":""}" data-drop-date="${dateStr}" onclick="location.hash='#/jour/${dateStr}'">
          <span class="num">${d}</span>
        </div>`;
    }
  }

  document.getElementById("cal-wrap").innerHTML = `
    ${viewSwitcherHTML()}
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <h2>${MONTHS_FR[m]} ${y}</h2>
      <button onclick="changeMonth(1)">›</button>
    </div>
    ${homeToolbarHTML()}
    <div class="cal-grid">
      ${DOW_FR.map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="upcoming" id="upcoming"></div>
    <button class="fab" title="Ajouter une fiche" aria-label="Ajouter une fiche" onclick="location.hash='#/fiche/nouvelle/${(y === today.getFullYear() && m === today.getMonth()) ? todayStr : fmtDate(y, m, 1)}'">+</button>
  `;
  loadUpcoming(todayStr);
  refreshTaskBadge();
  maybeShowTutorial();
}

async function loadUpcoming(todayStr){
  const box = document.getElementById("upcoming");
  if (!box) return;
  let q = supabaseClient.from("content_cards")
    .select("id, card_date, status, platform, post_time")
    .is("deleted_at", null)
    .gte("card_date", todayStr)
    .in("status", ["a_faire", "programme"])
    .order("card_date", { ascending: true })
    .order("post_time", { ascending: true })
    .limit(3);
  q = scopeToCurrentCalendar(q);
  const { data, error } = await q;
  const box2 = document.getElementById("upcoming");
  if (!box2 || error) { if (box2) box2.innerHTML = ""; return; }
  const rows = (data || []).map(c => {
    const icon = PLATFORM_ICON[c.platform] || PLATFORM_ICON["Autre"];
    const p = String(c.card_date).split("-").map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    return `<div class="up-row" onclick="location.hash='#/fiche/${h(c.id)}'">
      <i class="${icon}"></i>
      <span class="up-date">${DOW_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}</span>
      ${c.post_time ? `<span class="up-time">${h(String(c.post_time).slice(0,5))}</span>` : ""}
      <span class="status-pill ${h(c.status)}">${h(STATUS_LABEL[c.status] || "")}</span>
    </div>`;
  }).join("");
  box2.innerHTML = `<h3>Prochaines publications</h3>` + (rows || `<div class="up-none">Rien de prévu pour l'instant.</div>`);
}

/* ---------------- GLISSER-DÉPOSER (souris et tactile) ---------------- */
function notify(msg, action){
  const old = document.getElementById("toast"); if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.id = "toast";
  const sp = document.createElement("span"); sp.textContent = msg; t.appendChild(sp);
  if (action) {
    const b = document.createElement("button"); b.textContent = action.label;
    b.addEventListener("click", () => { t.remove(); action.fn(); });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, action ? 8000 : 4500);
}

async function moveCardToDate(id, oldDate, newDate, silent){
  if (!UUID_RE.test(id) || !isValidDateStr(newDate) || oldDate === newDate) return;
  const { error } = await supabaseClient.from("content_cards").update({ card_date: newDate }).eq("id", id);
  if (error) { notify("Impossible de déplacer la fiche : " + error.message); return; }
  await renderHome();
  notify(silent ? "Déplacement annulé" : "Fiche déplacée au " + formatFrDate(newDate),
    silent ? null : { label: "Annuler", fn: () => moveCardToDate(id, newDate, oldDate, true) });
}

let dnd = null;
let dndSuppressClickUntil = 0;

function dndStart(){
  if (!dnd || dnd.active) return;
  clearTimeout(dnd.timer);
  if (dnd.el.hasAttribute("data-drag-multi")) {
    notify("Plusieurs fiches ce jour-là : ouvrez la vue Semaine pour les déplacer une par une.");
    dndSuppressClickUntil = Date.now() + 500;
    dnd = null; return;
  }
  dnd.active = true;
  const r = dnd.el.getBoundingClientRect();
  dnd.offX = dnd.x - r.left; dnd.offY = dnd.y - r.top;
  const g = dnd.el.cloneNode(true);
  g.removeAttribute("onclick");
  g.classList.add("dnd-ghost");
  g.style.width = r.width + "px"; g.style.height = r.height + "px";
  document.body.appendChild(g);
  dnd.ghost = g;
  dnd.el.classList.add("dnd-source");
  try { navigator.vibrate && navigator.vibrate(20); } catch(e) {}
  dndTick();
}

function dndTick(){
  if (!dnd || !dnd.active) return;
  const y = dnd.y, vh = window.innerHeight;
  if (y < 90) window.scrollBy(0, -14);
  else if (y > vh - 90) window.scrollBy(0, 14);
  dnd.raf = requestAnimationFrame(dndTick);
}

function dndMoveGhost(){
  dnd.ghost.style.left = (dnd.x - dnd.offX) + "px";
  dnd.ghost.style.top = (dnd.y - dnd.offY) + "px";
  const under = document.elementFromPoint(dnd.x, dnd.y);
  const target = under && under.closest ? under.closest("[data-drop-date]") : null;
  if (target !== dnd.over) {
    if (dnd.over) dnd.over.classList.remove("drop-hover");
    if (target) target.classList.add("drop-hover");
    dnd.over = target;
  }
}

function dndEnd(drop){
  if (!dnd) return;
  clearTimeout(dnd.timer);
  const d = dnd; dnd = null;
  if (!d.active) return;
  cancelAnimationFrame(d.raf);
  dndSuppressClickUntil = Date.now() + 500;
  if (d.ghost) d.ghost.remove();
  d.el.classList.remove("dnd-source");
  if (d.over) d.over.classList.remove("drop-hover");
  if (drop && d.over) {
    moveCardToDate(d.el.getAttribute("data-drag-card"), d.el.getAttribute("data-drag-date"), d.over.getAttribute("data-drop-date"));
  }
}

document.addEventListener("pointerdown", (e) => {
  if (dnd) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const el = e.target.closest && e.target.closest("[data-drag-card],[data-drag-multi]");
  if (!el) return;
  dnd = { el, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, over: null, ghost: null, raf: 0,
          touch: e.pointerType !== "mouse" };
  if (dnd.touch) dnd.timer = setTimeout(dndStart, 400); // appui long
});
document.addEventListener("pointermove", (e) => {
  if (!dnd) return;
  dnd.x = e.clientX; dnd.y = e.clientY;
  if (!dnd.active) {
    const moved = Math.hypot(dnd.x - dnd.x0, dnd.y - dnd.y0);
    if (dnd.touch) { if (moved > 10) { clearTimeout(dnd.timer); dnd = null; } } // l'utilisateur fait défiler la page
    else if (moved > 6) dndStart();
    if (!dnd || !dnd.active) return;
  }
  dndMoveGhost();
});
document.addEventListener("pointerup", () => { if (dnd) { dnd.active ? dndEnd(true) : (clearTimeout(dnd.timer), dnd = null); } });
document.addEventListener("pointercancel", () => { if (dnd) { dnd.active ? dndEnd(false) : (clearTimeout(dnd.timer), dnd = null); } });
document.addEventListener("touchmove", (e) => { if (dnd && dnd.active) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (e) => {
  if (dnd || (e.target.closest && e.target.closest("[data-drag-card],[data-drag-multi]"))) e.preventDefault();
});
document.addEventListener("click", (e) => {
  if (Date.now() < dndSuppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
}, true);

const MONTHS_SHORT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DOW_LONG = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function startOfWeek(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // lundi
  return x;
}
function addDays(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function dateStrOf(d){ return fmtDate(d.getFullYear(), d.getMonth(), d.getDate()); }

function setViewMode(mode){

    state.anchorDate = (state.viewYear === now.getFullYear() && state.viewMonth === now.getMonth())
      ? now : new Date(state.viewYear, state.viewMonth, 1);
  } else if (state.anchorDate) {
    state.viewMonth = state.anchorDate.getMonth();

async function renderRangeView(){
  app.innerHTML = topbarHTML() + `<div id="cal-wrap"><div class="center"><div class="spinner"></div></div></div>`;

  const days = state.viewMode === "week" ? 7 : 14;
  if (!state.anchorDate) state.anchorDate = new Date();
  const start = startOfWeek(state.anchorDate);
  const end = addDays(start, days - 1);

  let query = supabaseClient
    .from("content_cards")
    .select("id, card_date, status, platform, format, image_url, image_urls, post_time")
    .is("deleted_at", null)
    .gte("card_date", dateStrOf(start))
    .lte("card_date", dateStrOf(end))
    .order("post_time", { ascending: true });
  query = scopeToCurrentCalendar(query);
  const { data, error } = await query;

  const byDay = {};
  (data || []).forEach(c => {
    if (!byDay[c.card_date]) byDay[c.card_date] = [];
    byDay[c.card_date].push(c);
  });

  const now = new Date();
  const todayStr = dateStrOf(now);
  const title = `${start.getDate()} ${MONTHS_SHORT[start.getMonth()]} – ${end.getDate()} ${MONTHS_SHORT[end.getMonth()]} ${end.getFullYear()}`;

  let blocks = "";
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    const ds = dateStrOf(d);
    const cards = byDay[ds] || [];
    blocks += `
      <section class="rg-day" data-drop-date="${ds}">
        <div class="rg-day-head">
          <span class="rg-day-title" onclick="location.hash='#/jour/${ds}'">
            ${DOW_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}
            ${ds === todayStr ? `<span class="rg-today">Aujourd'hui</span>` : ""}
          </span>
          <button class="btn outline rg-add" onclick="location.hash='#/fiche/nouvelle/${ds}'" title="Ajouter une fiche">+</button>
        </div>
        ${cards.length
          ? `<div class="rg-grid ${state.viewMode}">${cards.map(rangeCardHTML).join("")}</div>`
          : `<div class="rg-none">Rien de prévu</div>`}
      </section>`;
  }

  document.getElementById("cal-wrap").innerHTML = `
    ${viewSwitcherHTML()}
    <div class="month-nav">
      <button onclick="shiftRange(-1)">‹</button>
      <h2 style="text-transform:none;">${title}</h2>
      <button onclick="shiftRange(1)">›</button>
    </div>
    ${homeToolbarHTML()}
    ${error ? `<div class="error-msg">${h(error.message)}</div>` : blocks}
    <button class="fab" title="Ajouter une fiche" aria-label="Ajouter une fiche" style="bottom:22px;" onclick="location.hash='#/fiche/nouvelle/${(todayStr >= dateStrOf(start) && todayStr <= dateStrOf(end)) ? todayStr : dateStrOf(start)}'">+</button>
    <div style="height:80px;"></div>
  `;
  refreshTaskBadge();
  maybeShowTutorial();
}

function formatFrDate(dateStr){

  return `${dow} ${d} ${MONTHS_FR[m-1]} ${y}`;
}

/* ---------------- FICHE (create / edit) ---------------- */
let ficheImages = []; // {id, url: string|null (existant), file: File|null (nouveau), preview: string}
let originalImageUrls = []; // photos présentes à l'ouverture de la fiche (pour savoir lesquelles nettoyer)

function randId(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

function storagePathFromPublicUrl(url, bucket){
  if (!url) return null;
  const marker = `/object/public/${bucket}/`;
  const idx = url.indexOf(marker);
  if (idx === -1) return null;
  return decodeURIComponent(url.slice(idx + marker.length));
}

async function deleteStorageImages(urls){
  const paths = (urls || []).map(u => storagePathFromPublicUrl(u, "content-images")).filter(Boolean);
  if (!paths.length) return;
  try { await supabaseClient.storage.from("content-images").remove(paths); }
  catch (e) { /* best-effort : on ne bloque pas l'action principale si le nettoyage échoue */ }
}

// Nombre de fiches (vivantes OU en corbeille, les vôtres uniquement) qui utilisent encore cette photo.
// Une fiche dupliquée partage les mêmes fichiers que l'originale : on ne doit donc jamais
// supprimer un fichier tant qu'une autre fiche s'en sert.
async function countCardsUsingImage(url){
  const base = () => supabaseClient.from("content_cards").select("id", { count: "exact", head: true });
  const a = await base().eq("image_url", url);
  if (a.error) throw a.error;
  let b = await base().contains("image_urls", [url]);                    // colonne de type tableau (text[])
  if (b.error) b = await base().contains("image_urls", JSON.stringify([url])); // colonne de type json(b)
  if (b.error) throw b.error;
  return (a.count || 0) + (b.count || 0);
}

// À appeler APRÈS avoir supprimé / modifié les fiches concernées.
// Supprime du Storage uniquement les photos que plus aucune fiche n'utilise.
// En cas de doute (erreur de vérification), la photo est conservée.
async function deleteStorageImagesIfUnused(urls){
  const candidates = [...new Set((urls || []).filter(Boolean))]
    .filter(u => storagePathFromPublicUrl(u, "content-images"));
  const unused = [];
  for (const url of candidates) {
    try { if ((await countCardsUsingImage(url)) === 0) unused.push(url); }
    catch (e) { /* on garde le fichier dans le doute */ }
  }
  await deleteStorageImages(unused);
}

function cardImageUrls(card){
  if (!card) return [];
  if (Array.isArray(card.image_urls) && card.image_urls.length) return card.image_urls;
  return card.image_url ? [card.image_url] : [];
}

function ficheImagesInit(card){
  ficheImages = [];
  const urls = cardImageUrls(card);
  originalImageUrls = urls.slice();
  urls.forEach(u => ficheImages.push({ id: randId(), url: u, file: null, preview: u }));
}

function openFilePicker(multiple, onFiles){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (multiple) input.multiple = true;
  input.onchange = () => { if (input.files.length) onFiles(Array.from(input.files)); };
  input.click();
}

function renderPhotoCarousel(){
  const wrap = document.getElementById("photo-carousel");
  if (!wrap) return;
  wrap.innerHTML = ficheImages.map((img, i) => `
    <div class="photo-slide">
      <img src="${h(img.preview)}">
      <div class="photo-actions">
        <button type="button" data-action="replace" data-idx="${i}">Remplacer</button>
        <button type="button" data-action="remove" data-idx="${i}">Supprimer</button>
      </div>
    </div>
  `).join("") + `<div class="photo-add-tile" id="photo-add-tile">📷 + Ajouter une photo</div>`;

  wrap.querySelectorAll('[data-action="remove"]').forEach(btn => {
    btn.addEventListener("click", () => {
      ficheImages.splice(Number(btn.dataset.idx), 1);
      renderPhotoCarousel();
    });
  });
  wrap.querySelectorAll('[data-action="replace"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.idx);
      openFilePicker(false, (files) => {
        ficheImages[idx] = { id: ficheImages[idx].id, url: null, file: files[0], preview: URL.createObjectURL(files[0]) };
        renderPhotoCarousel();
      });
    });
  });
  const addTile = document.getElementById("photo-add-tile");
  if (addTile) {
    addTile.addEventListener("click", () => {
      openFilePicker(true, (files) => {
        files.forEach(file => ficheImages.push({ id: randId(), url: null, file, preview: URL.createObjectURL(file) }));
        renderPhotoCarousel();
      });
    });
  }
}

  });
  if (card) {
    document.getElementById("del-fiche-btn").addEventListener("click", async () => {
      if (!confirm("Mettre cette fiche à la corbeille ? Vous pourrez la restaurer depuis la Corbeille.")) return;
      ficheDirtyCheck = null;
      const { error } = await supabaseClient.from("content_cards").update({ deleted_at: new Date().toISOString() }).eq("id", card.id);
      if (error) { alert(error.message); return; }
      location.hash = `#/jour/${dateStr}`;
    });
    document.getElementById("dup-fiche-btn").addEventListener("click", async () => {
      ficheDirtyCheck = null;
      const dupPayload = {
        user_id: state.session.user.id,
        client_id: state.currentClientId,
        card_date: card.card_date,
        platform: card.platform,
        format: card.format,
        category: card.category,
        post_time: card.post_time,
        description: card.description,
        hashtags: card.hashtags,
        observation: card.observation,
        status: "a_faire",
        image_urls: cardImageUrls(card),
        image_url: card.image_url || null
      };
      const { data: created, error } = await supabaseClient.from("content_cards").insert(dupPayload).select().single();
      if (error) { alert(error.message); return; }
      if (ficheTasks.length) {
        await supabaseClient.from("card_tasks").insert(
          ficheTasks.map(t => ({ card_id: created.id, user_id: state.session.user.id, title: t.title, done: false })));
      }
      location.hash = `#/fiche/${created.id}`;
    });
    const pdfBtn = document.getElementById("pdf-fiche-btn");
    if (pdfBtn) pdfBtn.addEventListener("click", () => exportFichePdf(dateStr));
    document.getElementById("move-fiche-btn").addEventListener("click", async () => {
      const newDate = document.getElementById("f-move-date").value;
      if (!newDate) { alert("Choisissez une date."); return; }
      if (newDate === dateStr) return;
      ficheDirtyCheck = null;
      const { error } = await supabaseClient.from("content_cards").update({ card_date: newDate }).eq("id", card.id);
      if (error) { alert(error.message); return; }
      location.hash = `#/jour/${newDate}`;
    });
  }

  // Avertissement si on quitte la fiche avec des modifications non enregistrées
  const initialSnap = ficheSnapshot();
  ficheDirtyCheck = () => ficheSnapshot() !== initialSnap;
}

/* ---------------- TÂCHES D'UNE FICHE ---------------- */
let ficheTasks = [];          // { id, title, done, tmp? }
let ficheTaskCardId = null;   // null = fiche pas encore créée (tâches gardées en mémoire)
let ficheTasksError = "";

async function ficheTasksInit(card){
  ficheTasks = []; ficheTasksError = ""; ficheTaskCardId = card ? card.id : null;
  if (!card) return;
  const { data, error } = await supabaseClient.from("card_tasks")
    .select("id, title, done").eq("card_id", card.id).order("created_at", { ascending: true });
  if (error) ficheTasksError = "Les tâches ne sont pas disponibles pour le moment.";
  else ficheTasks = data || [];
}

function renderFicheTasks(){
  const box = document.getElementById("f-tasks");
  if (!box) return;
  const total = ficheTasks.length, done = ficheTasks.filter(t => t.done).length;
  box.innerHTML = `
    ${ficheTasksError ? `<div class="error-msg">${h(ficheTasksError)}</div>` : ""}
    ${total ? `<div class="tasks-head"><span>${done} / ${total} faite${done > 1 ? "s" : ""}</span></div>` : ""}
    ${ficheTasks.map(t => `
      <div class="task-row ${t.done ? "done" : ""}">
        <input type="checkbox" data-tid="${h(t.id)}" ${t.done ? "checked" : ""} aria-label="Tâche faite">
        <span class="t">${h(t.title)}</span>
        <button type="button" class="t-del" data-del="${h(t.id)}" aria-label="Supprimer la tâche">✕</button>
      </div>`).join("")}
    <div class="task-add">
      <input type="text" id="f-task-input" maxlength="200" placeholder="Ajouter une tâche…" enterkeyhint="done">
      <button type="button" class="btn gold" id="f-task-add-btn">+</button>
    </div>`;
  const inp = document.getElementById("f-task-input");
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addFicheTask(); } });
  document.getElementById("f-task-add-btn").addEventListener("click", addFicheTask);
}

async function addFicheTask(){
  const inp = document.getElementById("f-task-input");
  if (!inp) return;
  const title = inp.value.trim().slice(0, 200);
  if (!title) return;
  if (ficheTaskCardId) {
    const { data, error } = await supabaseClient.from("card_tasks")
      .insert({ card_id: ficheTaskCardId, user_id: state.session.user.id, title }).select("id, title, done").single();
    if (error) { notify("Impossible d'ajouter la tâche : " + error.message); return; }
    ficheTasks.push(data);
  } else {
    ficheTasks.push({ id: "tmp_" + randId(), title, done: false, tmp: true });
  }
  renderFicheTasks();
  const again = document.getElementById("f-task-input"); if (again) again.focus();
}

// Si du texte est tapé dans le champ mais pas encore ajouté, on l'ajoute à l'enregistrement
async function flushTaskInput(){
  const inp = document.getElementById("f-task-input");
  if (inp && inp.value.trim()) { try { await addFicheTask(); } catch(e) {} }
}

function wireFicheTasks(){
  renderFicheTasks();
  const box = document.getElementById("f-tasks");
  box.addEventListener("change", async (e) => {
    const cb = e.target.closest("input[data-tid]"); if (!cb) return;
    const t = ficheTasks.find(x => x.id === cb.dataset.tid); if (!t) return;
    const prev = t.done; t.done = cb.checked;
    if (ficheTaskCardId) {
      const { error } = await supabaseClient.from("card_tasks")
        .update({ done: t.done, done_at: t.done ? new Date().toISOString() : null }).eq("id", t.id);
      if (error) { t.done = prev; notify("Impossible d'enregistrer : " + error.message); }
    }
    renderFicheTasks();
  });
  box.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-del]"); if (!b) return;
    const id = b.dataset.del;
    if (ficheTaskCardId) {
      const { error } = await supabaseClient.from("card_tasks").delete().eq("id", id);
      if (error) { notify("Impossible de supprimer : " + error.message); return; }
    }
    ficheTasks = ficheTasks.filter(x => x.id !== id);
    renderFicheTasks();
  });
}

// Ouvre la fenêtre d'impression du navigateur sur une mise en page propre :
// choisir « Enregistrer au format PDF » comme imprimante.
async function exportFichePdf(dateStr){
  if (!state.profile?.is_cm) return;
  const g = (id) => (document.getElementById(id)?.value || "").trim();
  const withObs = !!document.getElementById("f-pdf-obs")?.checked;
  const urls = ficheImages.map(i => i.url || (i.file ? URL.createObjectURL(i.file) : null)).filter(Boolean);
  const pairs = [
    ["Date", formatFrDate(dateStr) + (g("f-time") ? " à " + g("f-time") : "")],
    ["Plateforme", g("f-platform")], ["Format", g("f-format")],
    ["Catégorie", g("f-category")], ["Statut", STATUS_LABEL[g("f-status")] || ""]
  ].filter(p => p[1]);
  const block = (title, text) => text ? `<div class="pr-h">${h(title)}</div><div class="pr-txt">${h(text)}</div>` : "";

  const old = document.getElementById("print-root"); if (old) old.remove();
  const root = document.createElement("div");
  root.id = "print-root";
  root.innerHTML = `
    <div class="pr-head">
      <img src="${LOGO_DATA_URI}" alt="">
      <div>
        <div class="pr-t">Fiche de contenu</div>
        <div class="pr-s">${state.currentClientName ? h(state.currentClientName) + " · " : ""}${h(LEGAL.name)}</div>
      </div>
    </div>
    <div class="pr-meta">${pairs.map(p => `<div><b>${h(p[0])} :</b> ${h(p[1])}</div>`).join("")}</div>
    ${urls.length ? `<div class="pr-photos ${urls.length === 1 ? "one" : ""}">${urls.map(u => `<img src="${h(u)}" alt="">`).join("")}</div>` : ""}
    ${block("Description", g("f-desc"))}
    ${block("Hashtags", g("f-hashtags"))}
    ${withObs ? block("Observations", g("f-observation")) : ""}
    <div class="pr-foot">Document généré avec MADE planificateur le ${h(new Date().toLocaleDateString("fr-FR"))}</div>`;
  document.body.appendChild(root);

  const imgs = [...root.querySelectorAll("img")];
  await Promise.race([
    Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))),
    new Promise(r => setTimeout(r, 6000))
  ]);

  const prevTitle = document.title;
  document.title = `Fiche ${dateStr} ${g("f-platform")}`.trim();
  document.body.classList.add("printing");
  const cleanup = () => { document.body.classList.remove("printing"); document.title = prevTitle; };
  window.addEventListener("afterprint", cleanup, { once: true });
  setTimeout(cleanup, 120000);
  window.print();
}

function ficheSnapshot(){
  const g = (id) => document.getElementById(id)?.value ?? "";
  return JSON.stringify({
    platform: g("f-platform"), format: g("f-format"), category: g("f-category"),
    time: g("f-time"), desc: g("f-desc"), hashtags: g("f-hashtags"),
    observation: g("f-observation"), status: g("f-status"),

  });

// Redimensionne et compresse une image côté navigateur avant envoi
// (limite la taille max à ~1600px et convertit en JPEG qualité 0.82)
function compressImage(file, maxDim = 1600, quality = 0.82){
  return new Promise((resolve) => {
    if (!file.type || !file.type.startsWith("image/")) { resolve(file); return; }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        if (!blob) { resolve(file); return; } // échec de compression -> on envoie l'original
        resolve(new File([blob], (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(file); }; // échec -> on envoie l'original
    img.src = objectUrl;
  });
}

async function uploadAllImages(){
  const uid = state.session.user.id;
  const results = [];
  for (const img of ficheImages) {
    if (img.file) {
      const compressed = await compressImage(img.file);
      const rawExt = (compressed.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g, "");
      const ext = rawExt || "jpg";
      const path = `${uid}/${Date.now()}_${randId()}.${ext}`;
      const { error } = await supabaseClient.storage.from("content-images").upload(path, compressed, { upsert: true });
      if (error) throw error;
      const { data } = supabaseClient.storage.from("content-images").getPublicUrl(path);
      results.push(data.publicUrl);
    } else if (img.url) {
      results.push(img.url);
    }
  }
  return results;
}

async function saveFiche(existingCard, dateStr, createNewAfter){
  const msg = document.getElementById("fiche-msg");
  msg.innerHTML = "";
  try {
    await flushTaskInput();
    const imageUrls = await uploadAllImages();
    const payload = {
      user_id: state.session.user.id,
      client_id: state.currentClientId,
      card_date: dateStr,
      platform: document.getElementById("f-platform").value,
      format: document.getElementById("f-format").value,
      category: document.getElementById("f-category").value,
      post_time: document.getElementById("f-time").value || null,
      description: document.getElementById("f-desc").value.trim(),
      hashtags: document.getElementById("f-hashtags").value.trim(),
      observation: document.getElementById("f-observation").value.trim(),
      status: document.getElementById("f-status").value,
      image_urls: imageUrls,
      image_url: imageUrls[0] || null
    };

    if (existingCard) {
      const { error } = await supabaseClient.from("content_cards").update(payload).eq("id", existingCard.id);
      if (error) throw error;
    } else {
      const { data: created, error } = await supabaseClient.from("content_cards").insert(payload).select("id").single();
      if (error) throw error;
      if (ficheTasks.length) {
        const { error: tErr } = await supabaseClient.from("card_tasks").insert(
          ficheTasks.map(t => ({ card_id: created.id, user_id: state.session.user.id, title: t.title, done: t.done, done_at: t.done ? new Date().toISOString() : null })));
        if (tErr) notify("La fiche est enregistrée, mais pas ses tâches : " + tErr.message);
      }
    }

    const removedUrls = originalImageUrls.filter(u => !imageUrls.includes(u));
    await deleteStorageImagesIfUnused(removedUrls);

    ficheDirtyCheck = null; // enregistré : plus rien à avertir en quittant

    if (createNewAfter) {
      location.hash = `#/fiche/nouvelle/${dateStr}`;
      route(); // hash may be identical to previous "new" route, force refresh
    } else {
      location.hash = `#/jour/${dateStr}`;
    }
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${h(err.message || String(err))}</div>`;
  }
}

async function loadClientsTab(status){
  const wrap = document.getElementById("clients-wrap");
  wrap.innerHTML = `<div class="spinner"></div>`;
  const { data, error } = await supabaseClient
    .from("clients")
    .select("*")
    .eq("status", status)
    .order(status === "corbeille" ? "trashed_at" : "created_at", { ascending: false });

  if (error) { wrap.innerHTML = `<div class="error-msg">${h(error.message)}</div>`; return; }
  if (!data || !data.length) {
    const emptyMsg = status === "actif" ? "Aucun client pour l'instant." : status === "archive" ? "Aucun client archivé." : "La corbeille est vide.";
    wrap.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
    return;
  }

  wrap.innerHTML = data.map(c => {
    const initial = (c.name || "?").trim().charAt(0).toUpperCase();
    let actions = "";
    if (status === "actif") {
      actions = `
        <button type="button" class="btn gold" style="padding:6px 12px;flex:none;" data-switch="${c.id}" data-name="${h(c.name)}">Basculer</button>
        <button type="button" class="btn outline" style="padding:6px 12px;flex:none;" data-archive="${c.id}">Archiver</button>
        <button type="button" class="btn danger" style="padding:6px 12px;flex:none;" data-trash="${c.id}">🗑</button>`;
    } else if (status === "archive") {
      actions = `
        <button type="button" class="btn outline" style="padding:6px 12px;flex:none;" data-restore="${c.id}">Réactiver</button>
        <button type="button" class="btn danger" style="padding:6px 12px;flex:none;" data-trash="${c.id}">🗑</button>`;
    } else {
      const daysLeft = Math.max(0, 14 - Math.floor((Date.now() - new Date(c.trashed_at).getTime()) / 86400000));
      const canPurge = daysLeft === 0;
      actions = `
        <span style="font-size:11px;color:var(--muted);flex:none;">${canPurge ? "suppression possible" : daysLeft + "j avant suppression possible"}</span>
        <button type="button" class="btn outline" style="padding:6px 12px;flex:none;" data-restore="${c.id}">Restaurer</button>
        <button type="button" class="btn danger" style="padding:6px 12px;flex:none;" data-purge="${c.id}" ${canPurge ? "" : "disabled"}>Suppr. def.</button>`;
    }
    return `
      <div class="fiche-item" style="cursor:default;">
        <span class="avatar" style="width:40px;height:40px;font-size:16px;flex:none;">${h(initial)}</span>
        <div class="info"><div class="l1">${h(c.name)}</div></div>
        ${actions}
      </div>`;
  }).join("");

  wrap.querySelectorAll("[data-switch]").forEach(btn => {
    btn.addEventListener("click", () => switchClient(btn.dataset.switch, btn.dataset.name));
  });
  wrap.querySelectorAll("[data-archive]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await supabaseClient.from("clients").update({ status: "archive" }).eq("id", btn.dataset.archive);
      if (error) { alert(error.message); return; }
      if (state.currentClientId === btn.dataset.archive) switchClientLocalReset();
      loadClientsTab("actif");
    });
  });
  wrap.querySelectorAll("[data-trash]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.trash;
      if (!confirm("Mettre ce client à la corbeille ? Vous pourrez le supprimer définitivement vous-même après 14 jours (rien n'est supprimé automatiquement).")) return;
      const { error } = await supabaseClient.from("clients").update({ status: "corbeille", trashed_at: new Date().toISOString() }).eq("id", id);
      if (error) { alert(error.message); return; }
      if (state.currentClientId === id) switchClientLocalReset();
      loadClientsTab(document.querySelector(".client-tab.gold").dataset.tab);
    });
  });
  wrap.querySelectorAll("[data-restore]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await supabaseClient.from("clients").update({ status: "actif", trashed_at: null }).eq("id", btn.dataset.restore);
      if (error) { alert(error.message); return; }
      loadClientsTab(document.querySelector(".client-tab.gold").dataset.tab);
    });
  });
  wrap.querySelectorAll("[data-purge]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer définitivement ce client et tout son calendrier ? Impossible à annuler.")) return;
      const id = btn.dataset.purge;
      const { data: cards } = await supabaseClient.from("content_cards").select("image_url, image_urls").eq("client_id", id);
      const { error } = await supabaseClient.from("clients").delete().eq("id", id);
      if (error) { alert(error.message); return; }
      if (cards) {
        await deleteStorageImagesIfUnused(cards.flatMap(c => cardImageUrls(c)));
      }
      if (state.currentClientId === id) switchClientLocalReset();
      loadClientsTab("corbeille");
    });
  });
}

  } catch (err) {
    document.getElementById("s-res").innerHTML = `<div class="error-msg">${h(err.message || String(err))}</div>`;
    return;
  }
  const res = document.getElementById("s-res");
  const qEl = document.getElementById("s-q"), stEl = document.getElementById("s-status");
  if (!qEl) return;
  const hl = (text, words) => {
    let out = h(text);
    words.forEach(w => { if (w.length > 1) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); });
    return out;
  };
  function run(){
    const raw = qEl.value.trim(), st = stEl.value;
    const words = normSearch(raw).split(/\s+/).filter(Boolean);
    if (!words.length && !st) { res.innerHTML = `<div class="empty-state" style="color:var(--muted);">${cards.length} fiche(s). Tapez un mot pour rechercher.</div>`; return; }
    const found = cards.filter(c => {
      if (st && c.status !== st) return false;
      const hay = normSearch([c.description, c.hashtags, c.observation, c.platform, c.format, c.category].join(" "));
      return words.every(w => hay.includes(w));
    });
    if (!found.length) { res.innerHTML = `<div class="empty-state" style="color:var(--muted);">Aucune fiche trouvée.</div>`; return; }
    const shown = found.slice(0, 100);
    const rawWords = raw.split(/\s+/).filter(Boolean);
    res.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:8px;">${found.length} résultat(s)${found.length > 100 ? " — affichage des 100 plus récents" : ""}</div>` +
      shown.map(c => `
        <div class="fiche-item" onclick="location.hash='#/fiche/${h(c.id)}'">
          ${c.image_url ? `<img class="thumb" src="${h(c.image_url)}" alt="">` : `<div class="thumb"></div>`}
          <div class="info">
            <div class="l1"><i class="${PLATFORM_ICON[c.platform] || PLATFORM_ICON["Autre"]}"></i> ${h(formatFrDate(c.card_date))}</div>
            <div class="l2">${h(c.platform)} · ${h(c.format)} — ${rawWords.length ? hl(c.description || c.hashtags || "Sans description", rawWords) : h(c.description || "Sans description")}</div>
          </div>
          <span class="status-pill ${h(c.status)}">${h(STATUS_LABEL[c.status] || "")}</span>
        </div>`).join("");
  }
  let timer = null;
  qEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 180); });
  stEl.addEventListener("change", run);
  run();
  qEl.focus();
}

async function renderTodoList(){
  app.innerHTML = topbarHTML() + `
    <div class="page-title-row">
      <button class="back-btn" onclick="location.hash='#/'">‹</button>
      <h2>À faire</h2>
    </div>
    <div id="todo-wrap" class="center"><div class="spinner"></div></div>
  `;
  const { data, error } = await openTasksQuery(
    "id, title, created_at, content_cards!inner(id, card_date, platform, format, description, image_url, post_time)");

  const wrap = document.getElementById("todo-wrap");
  wrap.classList.remove("center");
  if (error) { wrap.innerHTML = `<div class="error-msg">${h(error.message)}</div>`; return; }
  if (!data || !data.length) { wrap.innerHTML = `<div class="empty-state">Aucune tâche en attente 🎉<br><span style="font-size:13px;">Ajoutez des tâches depuis une fiche de contenu.</span></div>`; return; }

  // regroupement : date -> fiche -> tâches
  const cards = new Map();
  data.forEach(t => {
    const c = t.content_cards;
    if (!cards.has(c.id)) cards.set(c.id, { card: c, tasks: [] });
    cards.get(c.id).tasks.push(t);
  });
  const list = [...cards.values()].sort((a, b) =>
    (a.card.card_date + (a.card.post_time || "99:99")).localeCompare(b.card.card_date + (b.card.post_time || "99:99")));
  const todayStr = dateStrOf(new Date());
  let html = "", lastDate = null;
  list.forEach(({ card: c, tasks }) => {
    if (c.card_date !== lastDate) {
      lastDate = c.card_date;
      html += `<div class="tl-date">${h(formatFrDate(c.card_date))}${c.card_date < todayStr ? `<span class="tl-late">En retard</span>` : (c.card_date === todayStr ? `<span class="tl-late" style="background:var(--gold);color:var(--on-gold);">Aujourd'hui</span>` : "")}</div>`;
    }
    tasks.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
    html += `
      <div class="tl-card">
        <div class="tl-card-head" onclick="location.hash='#/fiche/${h(c.id)}'">
          ${c.image_url ? `<img class="thumb" src="${h(c.image_url)}" alt="">` : `<div class="thumb"></div>`}
          <i class="${PLATFORM_ICON[c.platform] || PLATFORM_ICON["Autre"]}"></i>
          <span class="d">${h(c.platform)} · ${h(c.format)}${c.description ? " — " + h(c.description) : ""}</span>
        </div>
        ${tasks.map(t => `<div class="tl-task" onclick="location.hash='#/fiche/${h(c.id)}'">${h(t.title)}</div>`).join("")}
      </div>`;
  });
  wrap.innerHTML = html;
}

async function renderTrash(){
  app.innerHTML = topbarHTML() + `
    <div class="page-title-row">
      <button class="back-btn" onclick="location.hash='#/'">‹</button>
      <h2>Corbeille</h2>
    </div>
    <div class="card-box" style="margin-bottom:14px;font-size:13px;color:var(--muted);">
      Les fiches ici sont supprimées définitivement, photos comprises, 7 jours après leur mise à la corbeille. Vous pouvez les restaurer avant.
    </div>
    <div id="trash-wrap" class="center"><div class="spinner"></div></div>
  `;
  let query = supabaseClient
    .from("content_cards")
    .select("*")
    .not("deleted_at", "is", null)
    .order("deleted_at", { ascending: false });
  query = scopeToCurrentCalendar(query);
  const { data, error } = await query;

  const wrap = document.getElementById("trash-wrap");
  if (error) { wrap.innerHTML = `<div class="error-msg">${h(error.message)}</div>`; return; }
  if (!data || !data.length) { wrap.innerHTML = `<div class="empty-state">La corbeille est vide.</div>`; return; }
  wrap.innerHTML = data.map(c => `
    <div class="fiche-item" style="cursor:default;">
      ${c.image_url ? `<img class="thumb" src="${h(c.image_url)}">` : `<div class="thumb"></div>`}
      <div class="info">
        <div class="l1">${h(formatFrDate(c.card_date))}</div>
        <div class="l2">${h(c.platform)} · ${h(c.format)}</div>
      </div>
      <button type="button" class="btn outline" style="padding:6px 12px;flex:none;" data-restore="${c.id}">Restaurer</button>
      <button type="button" class="btn danger" style="padding:6px 12px;flex:none;" data-purge="${c.id}">Supprimer</button>
    </div>
  `).join("");

  wrap.querySelectorAll("[data-restore]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await supabaseClient.from("content_cards").update({ deleted_at: null }).eq("id", btn.dataset.restore);
      if (error) { alert(error.message); return; }
      renderTrash();
    });
  });
  wrap.querySelectorAll("[data-purge]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer définitivement cette fiche et ses photos ? Impossible à annuler.")) return;
      const id = btn.dataset.purge;
      const found = data.find(c => c.id === id);
      const { error } = await supabaseClient.from("content_cards").delete().eq("id", id);
      if (error) { alert(error.message); return; }
      if (found) await deleteStorageImagesIfUnused(cardImageUrls(found));
      renderTrash();
    });
  });
}

function formatBytes(bytes){
  bytes = Number(bytes) || 0;
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " Ko";
  if (bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + " Mo";
  return (bytes/(1024*1024*1024)).toFixed(2) + " Go";
}

/* ---------- Export et suppression des données (droits RGPD) ---------- */
async function fetchAllRows(makeQuery){
  const rows = [];
  const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await makeQuery().range(from, from + PAGE - 1);
    if (error) throw error;
    rows.push(...(data || []));
    if (!data || data.length < PAGE) break;
  }
  return rows;
}

async function exportMyData(){
  const user = state.session.user;
  const prof = await supabaseClient.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (prof.error) throw prof.error;
  const clients = await fetchAllRows(() => supabaseClient.from("clients").select("*").order("created_at", { ascending: true }).order("id"));
  const cards = await fetchAllRows(() => supabaseClient.from("content_cards").select("*").order("card_date", { ascending: true }).order("id"));
  let tasks = [];
  try { tasks = await fetchAllRows(() => supabaseClient.from("card_tasks").select("*").order("created_at", { ascending: true }).order("id")); } catch(e) { /* table absente : on exporte sans */ }
  const payload = {
    exporte_le: new Date().toISOString(),
    compte: { id: user.id, email: user.email, cree_le: user.created_at },
    profil: prof.data,
    clients,
    fiches: cards,
    taches: tasks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `made-planificateur-mes-donnees-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  return { fiches: cards.length, clients: clients.length };
}

// Supprime tous les fichiers de l'utilisateur (photos de fiches + avatar) via l'API Storage.
async function removeUserStorageFiles(uid){
  for (const bucket of ["content-images", "avatars"]) {
    for (let guard = 0; guard < 500; guard++) {
      const { data, error } = await supabaseClient.storage.from(bucket).list(uid, { limit: 100, offset: 0 });
      if (error) throw error;
      const files = (data || []).filter(f => f.name && f.id); // ignore d'éventuels dossiers
      if (!files.length) break;
      const { data: removed, error: rmErr } = await supabaseClient.storage.from(bucket).remove(files.map(f => `${uid}/${f.name}`));
      if (rmErr) throw rmErr;
      if (!removed || !removed.length) throw new Error("Certains fichiers n'ont pas pu être supprimés.");
    }
  }
}

async function deleteMyAccount(){
  const uid = state.session.user.id;
  await removeUserStorageFiles(uid);                       // 1) fichiers
  const { error } = await supabaseClient.rpc("delete_my_account"); // 2) données + compte
  if (error) throw error;
  try { await supabaseClient.auth.signOut({ scope: "local" }); } catch(e) { /* le compte n'existe déjà plus */ }
  try {
    localStorage.removeItem(`made_current_client_${uid}`);
    localStorage.removeItem("made_view_mode");
    localStorage.removeItem("made_tutorial_seen");
  } catch(e) {}
  state.session = null; state.profile = null; state.currentClientId = null; state.currentClientName = null;
}

function setTheme(t){
  const root = document.documentElement;
  if (t === "dark" || t === "light") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  try { if (t === "dark" || t === "light") localStorage.setItem("made_theme", t); else localStorage.removeItem("made_theme"); } catch(e) {}
  syncThemeColor();
}
function syncThemeColor(){
  const m = document.querySelector('meta[name="theme-color"]'); if (!m) return;
  const bg = getComputedStyle(document.body).backgroundColor;
  if (bg) m.setAttribute("content", bg);
}
