<style>
  :root{
    --green: #33421f;
    --green-dark: #232e15;
    --gold: #c9a34d;
    --gold-light: #e4c878;
    --beige: #f4efe1;
    --white: #ffffff;
    --ink: #2a2a22;
    --muted: #7a7462;
    --orange: #e8973a;
    --yellow: #eec94a;
    --vert-ok: #4c7a41;
    --radius: 14px;
    --shadow: 0 4px 18px rgba(51,66,31,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--beige);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #app{max-width:900px;margin:0 auto;min-height:100%;padding:0 16px 40px;}
  a{color:inherit;text-decoration:none;}
  button, select, input, textarea{font-family:inherit;font-size:15px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--green);color:var(--white);border:none;border-radius:10px;
    padding:12px 18px;cursor:pointer;font-weight:600;transition:.15s;
  }
  .btn:hover{background:var(--green-dark);}
  .btn.gold{background:var(--gold);color:var(--green-dark);}
  .btn.gold:hover{background:var(--gold-light);}
  .btn.outline{background:transparent;color:var(--green);border:1.5px solid var(--green);}
  .btn.danger{background:#b3462c;}
  .btn.danger:hover{background:#8f3821;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:600;font-size:13px;color:var(--green-dark);margin-bottom:6px;}
  .field input[type=text], .field input[type=email], .field input[type=password],
  .field select, .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid #ddd3ba;border-radius:10px;
    background:var(--white);color:var(--ink);
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--gold);
  }
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:44px;}
  .password-toggle{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;font-size:13px;font-weight:600;
  }
  .card-box{
    background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:16px;
  }
  .auth-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px 16px;
  }
  .auth-logo{width:90px;height:90px;object-fit:contain;margin-bottom:10px;}
  .auth-title{font-weight:800;color:var(--green-dark);font-size:22px;margin:0 0 4px;text-align:center;}
  .auth-sub{color:var(--muted);font-size:14px;margin:0 0 22px;text-align:center;}
  .auth-card{width:100%;max-width:400px;}
  .auth-switch{text-align:center;margin-top:14px;font-size:14px;color:var(--muted);}
  .auth-switch a{color:var(--green);font-weight:700;}
  .error-msg{background:#fbe6e0;color:#8f3821;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px;}
  .ok-msg{background:#e7f0e3;color:var(--green-dark);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 10px;gap:10px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:38px;height:38px;object-fit:contain;}
  .brand span{font-weight:800;color:var(--green-dark);font-size:17px;letter-spacing:.2px;}
  .profile-chip{
    display:flex;align-items:center;gap:10px;background:var(--white);
    border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--shadow);cursor:pointer;border:none;
  }
  .profile-chip .avatar{
    width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--gold-light);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green-dark);font-size:13px;
  }
  .profile-chip span{font-weight:700;font-size:14px;color:var(--green-dark);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;}
  .month-nav h2{margin:0;color:var(--green-dark);font-size:19px;text-transform:capitalize;}
  .month-nav button{
    background:var(--white);border:1.5px solid #e2d8bd;color:var(--green);border-radius:8px;
    width:36px;height:36px;cursor:pointer;font-size:16px;font-weight:700;
  }
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px;}
  .cal-day{
    aspect-ratio:1/1;background:var(--white);border-radius:10px;border:1.5px solid #eee3c8;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;position:relative;min-height:52px;overflow:hidden;
  }
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day .num{font-weight:700;font-size:14px;color:var(--ink);position:relative;z-index:2;}
  .cal-day.today .num{color:var(--gold);}
  .cal-day.today{border-color:var(--gold);border-width:2px;}
  .cal-day .dots{display:flex;gap:3px;position:relative;z-index:2;}
  .cal-day .dots .dot{width:6px;height:6px;}
  .cal-day.status-orange{background:#fdecd8;border-color:var(--orange);}
  .cal-day.status-yellow{background:#fdf6d8;border-color:var(--yellow);}
  .cal-day.status-green{background:#e6efe2;border-color:var(--vert-ok);}
  .cal-day.has-thumb .num{
    background:rgba(255,255,255,.88);border-radius:6px;padding:0 4px;
  }
  .thumb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .thumb-bg-empty{background:var(--beige);}
  .platform-badge{
    position:absolute;bottom:3px;right:3px;width:17px;height:17px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;
    z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .count-badge{
    position:absolute;top:2px;right:2px;background:rgba(35,46,21,.75);color:#fff;
    font-size:9px;font-weight:700;border-radius:999px;padding:1px 5px;z-index:2;
  }
  .toolbar-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tutorial-overlay{position:fixed;inset:0;background:rgba(35,46,21,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .tutorial-box{background:var(--white);border-radius:16px;padding:26px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}
  .tutorial-box h2{color:var(--green-dark);margin:0 0 12px;font-size:19px;}
  .tutorial-box ul{padding-left:18px;color:var(--ink);font-size:14px;line-height:1.7;margin:0 0 18px;}

  .page-title-row{display:flex;align-items:center;gap:10px;margin:16px 0;}
  .back-btn{
    background:var(--white);border:1.5px solid #e2d8bd;border-radius:8px;
    width:36px;height:36px;cursor:pointer;font-size:16px;color:var(--green);
  }
  .page-title-row h2{margin:0;color:var(--green-dark);text-transform:capitalize;font-size:19px;}

  .fiche-item{
    display:flex;align-items:center;gap:12px;background:var(--white);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
  }
  .fiche-item .thumb{
    width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--beige);
    flex-shrink:0;
  }
  .fiche-item .info{flex:1;min-width:0;}
  .fiche-item .info .l1{font-weight:700;color:var(--green-dark);font-size:14px;}
  .fiche-item .info .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-pill{
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .status-pill.a_faire{background:#fdecd8;color:#8a5a15;}
  .status-pill.programme{background:#fdf6d8;color:#8a7515;}
  .status-pill.publie{background:#e6efe2;color:#345c2b;}

  .empty-state{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}

  .photo-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .photo-slide{position:relative;flex:0 0 85%;scroll-snap-align:center;background:var(--beige);border-radius:10px;overflow:hidden;min-height:220px;max-height:340px;display:flex;align-items:center;justify-content:center;}
  .photo-slide img{width:100%;height:100%;object-fit:contain;max-height:340px;}
  .photo-actions{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:8px;}
  .photo-actions button{background:rgba(35,46,21,.78);color:#fff;border:none;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;}
  .photo-add-tile{flex:0 0 85%;scroll-snap-align:center;min-height:220px;max-height:340px;display:flex;align-items:center;justify-content:center;
    border:1.5px dashed #ddd3ba;border-radius:10px;color:var(--muted);cursor:pointer;background:var(--white);font-weight:600;font-size:14px;}
  .file-btn{
    display:inline-block;background:var(--white);border:1.5px dashed #ddd3ba;border-radius:10px;
    padding:12px;text-align:center;cursor:pointer;color:var(--muted);width:100%;font-size:14px;
  }

  .fiche-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .fiche-actions .btn{flex:1;min-width:140px;}

  .profile-avatar-big{
    width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--gold-light);
    margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:28px;
    font-weight:700;color:var(--green-dark);
  }
  .center{text-align:center;}
  .spinner{
    width:22px;height:22px;border:3px solid #ddd3ba;border-top-color:var(--green);border-radius:50%;
    animation:spin .7s linear infinite;margin:20px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>

/* ---------------- ROUTER ---------------- */
let previousHash = location.hash;
let ficheDirtyCheck = null; // fonction qui renvoie true s'il y a des modifications non enregistrées sur la fiche affichée
let suppressGuard = false;

window.addEventListener("hashchange", () => {
  if (!suppressGuard && ficheDirtyCheck && ficheDirtyCheck()) {
    const ok = confirm("Vous avez des modifications non enregistrées sur cette fiche. Quitter sans enregistrer ?");
    if (!ok) {
      suppressGuard = true;
      location.hash = previousHash;
      suppressGuard = false;
      return;
    }
  }
  previousHash = location.hash;
  ficheDirtyCheck = null;
  route();
});
window.addEventListener("beforeunload", (e) => {
  if (ficheDirtyCheck && ficheDirtyCheck()) {
    e.preventDefault();
    e.returnValue = "";
  }
});
window.addEventListener("DOMContentLoaded", init);

async function init(){
  const { data } = await supabaseClient.auth.getSession();
  state.session = data.session;
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    state.session = session;
  });
  if (state.session) await loadProfile();
  route();
}

async function route(){
  const hash = location.hash || "#/";
  if (!state.session) {
    if (hash.startsWith("#/signup")) return renderSignup();
    return renderLogin();
  }
  if (!state.profile) await loadProfile();

  if (hash === "#/" || hash === "") return renderHome();
  if (hash.startsWith("#/jour/")) return renderDay(hash.replace("#/jour/",""));
  if (hash.startsWith("#/fiche/nouvelle/")) return renderFiche(null, hash.replace("#/fiche/nouvelle/",""));
  if (hash.startsWith("#/fiche/")) return renderFiche(hash.replace("#/fiche/",""));
  if (hash === "#/profil") return renderProfile();
  if (hash === "#/admin") return renderAdmin();
  if (hash === "#/a-faire") return renderTodoList();
  if (hash === "#/corbeille") return renderTrash();
  renderHome();
}

async function loadProfile(){
  const uid = state.session.user.id;
  let { data } = await supabaseClient.from("profiles").select("*").eq("id", uid).maybeSingle();
  if (!data) {
    const { data: created } = await supabaseClient.from("profiles")
      .insert({ id: uid, full_name: state.session.user.email.split("@")[0] })
      .select().single();
    data = created;
  }
  state.profile = data;
}

/* ---------------- TURNSTILE (captcha) ---------------- */
function isTurnstileConfigured(){
  const k = window.MADE_CONFIG.TURNSTILE_SITE_KEY || "";
  return !!k && !k.startsWith("VOTRE");
}
function mountTurnstile(){
  const el = document.getElementById("turnstile-box");
  if (!el) return;
  el.innerHTML = "";
  state.turnstileWidgetId = null;
  if (!isTurnstileConfigured()) return; // pas de clé réelle configurée -> pas de captcha à afficher
  let attempts = 0;
  const tryRender = () => {
    if (window.turnstile) {
      state.turnstileWidgetId = window.turnstile.render(el, {
        sitekey: window.MADE_CONFIG.TURNSTILE_SITE_KEY,
        theme: "light"
      });
    } else if (attempts < 40) {
      attempts++;
      setTimeout(tryRender, 150); // le script Turnstile charge en différé, on patiente
    } else {
      el.innerHTML = `<div class="error-msg">Le captcha n'a pas pu se charger.</div>`;
    }
  };
  tryRender();
}
function getTurnstileToken(){
  if (!window.turnstile || state.turnstileWidgetId === null) return "";
  return window.turnstile.getResponse(state.turnstileWidgetId) || "";
}

/* ---------------- HOME: monthly calendar ---------------- */
async function loadMonthCards(){
  const y = state.viewYear, m = state.viewMonth;
  const from = fmtDate(y, m, 1);
  const lastDay = new Date(y, m+1, 0).getDate();
  const to = fmtDate(y, m, lastDay);
  const { data, error } = await supabaseClient
    .from("content_cards")
    .select("id, card_date, status, platform, image_url, post_time")
    .is("deleted_at", null)
    .gte("card_date", from)
    .lte("card_date", to);
  state.monthCards = error ? [] : (data || []);
}

const DOT_COLOR = { a_faire: "var(--orange)", programme: "var(--yellow)", publie: "var(--vert-ok)" };
const STATUS_ORDER = ["a_faire", "programme", "publie"];

async function renderHome(){
  app.innerHTML = topbarHTML() + `<div id="cal-wrap" class="center"><div class="spinner"></div></div>`;
  await loadMonthCards();

  const y = state.viewYear, m = state.viewMonth;
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7; // lundi=0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const todayStr = fmtDate(today.getFullYear(), today.getMonth(), today.getDate());

  const cardsByDay = {};
  state.monthCards.forEach(c => {
    if (!cardsByDay[c.card_date]) cardsByDay[c.card_date] = [];
    cardsByDay[c.card_date].push(c);
  });

  function pickRepresentative(cards){
    // priorité : une fiche avec photo, la plus tôt dans la journée
    const sorted = cards.slice().sort((a,b) => (a.post_time||"99:99").localeCompare(b.post_time||"99:99"));
    return sorted.find(c => c.image_url) || sorted[0];
  }

  function dayClass(cards){
    if (!cards || !cards.length) return "";
    const set = new Set(cards.map(c => c.status));
    if (set.has("a_faire")) return "status-orange";
    if (set.has("programme")) return "status-yellow";
    return "status-green";
  }

  let cells = "";
  for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = fmtDate(y, m, d);
    const cards = cardsByDay[dateStr];
    const isToday = dateStr === todayStr;

    if (cards && cards.length) {
      const rep = pickRepresentative(cards);
      const icon = PLATFORM_ICON[rep.platform] || PLATFORM_ICON["Autre"];
      const badgeColor = DOT_COLOR[rep.status];
      const otherStatuses = STATUS_ORDER.filter(s => s !== rep.status && cards.some(c => c.status === s));
      cells += `
        <div class="cal-day has-thumb ${isToday ? "today":""}" onclick="location.hash='#/jour/${dateStr}'">
          ${rep.image_url ? `<img class="thumb-bg" src="${h(rep.image_url)}">` : `<div class="thumb-bg thumb-bg-empty"></div>`}
          <span class="num">${d}</span>
          ${cards.length > 1 ? `<span class="count-badge">${cards.length}</span>` : ""}
          <span class="platform-badge" style="background:${badgeColor}"><i class="${icon}"></i></span>
          ${otherStatuses.length ? `<span class="dots">${otherStatuses.map(s => `<span class="dot" style="background:${DOT_COLOR[s]}"></span>`).join("")}</span>` : ""}
        </div>`;
    } else {
      cells += `
        <div class="cal-day ${isToday ? "today":""}" onclick="location.hash='#/jour/${dateStr}'">
          <span class="num">${d}</span>
        </div>`;
    }
  }

  document.getElementById("cal-wrap").innerHTML = `
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <h2>${MONTHS_FR[m]} ${y}</h2>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="toolbar-row">
      <button class="btn outline" style="padding:8px 14px;" onclick="goToday()">📅 Aujourd'hui</button>
      <button class="btn outline" style="padding:8px 14px;" onclick="location.hash='#/a-faire'">📝 À faire</button>
      <button class="btn outline" style="padding:8px 14px;" onclick="location.hash='#/corbeille'">🗑 Corbeille</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--orange)"></span> À faire</span>
      <span><span class="dot" style="background:var(--yellow)"></span> Programmé</span>
      <span><span class="dot" style="background:var(--vert-ok)"></span> Posté</span>
    </div>
    <div class="cal-grid">
      ${DOW_FR.map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
  `;
  maybeShowTutorial();
}

function formatFrDate(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const date = new Date(y, m-1, d);
  const dow = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"][date.getDay()];
  return `${dow} ${d} ${MONTHS_FR[m-1]} ${y}`;
}

/* ---------------- FICHE (create / edit) ---------------- */
let ficheImages = []; // {id, url: string|null (existant), file: File|null (nouveau), preview: string}
let originalImageUrls = []; // photos présentes à l'ouverture de la fiche (pour savoir lesquelles nettoyer)

function randId(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

function storagePathFromPublicUrl(url, bucket){
  if (!url) return null;
  const marker = `/object/public/${bucket}/`;
  const idx = url.indexOf(marker);
  if (idx === -1) return null;
  return decodeURIComponent(url.slice(idx + marker.length));
}

async function deleteStorageImages(urls){
  const paths = (urls || []).map(u => storagePathFromPublicUrl(u, "content-images")).filter(Boolean);
  if (!paths.length) return;
  try { await supabaseClient.storage.from("content-images").remove(paths); }
  catch (e) { /* best-effort : on ne bloque pas l'action principale si le nettoyage échoue */ }
}

function cardImageUrls(card){
  if (!card) return [];
  if (Array.isArray(card.image_urls) && card.image_urls.length) return card.image_urls;
  return card.image_url ? [card.image_url] : [];
}

function ficheImagesInit(card){
  ficheImages = [];
  const urls = cardImageUrls(card);
  originalImageUrls = urls.slice();
  urls.forEach(u => ficheImages.push({ id: randId(), url: u, file: null, preview: u }));
}

function openFilePicker(multiple, onFiles){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (multiple) input.multiple = true;
  input.onchange = () => { if (input.files.length) onFiles(Array.from(input.files)); };

// Redimensionne et compresse une image côté navigateur avant envoi
// (limite la taille max à ~1600px et convertit en JPEG qualité 0.82)
function compressImage(file, maxDim = 1600, quality = 0.82){
  return new Promise((resolve) => {
    if (!file.type || !file.type.startsWith("image/")) { resolve(file); return; }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        if (!blob) { resolve(file); return; } // échec de compression -> on envoie l'original
        resolve(new File([blob], (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(file); }; // échec -> on envoie l'original
    img.src = objectUrl;
  });
}

async function uploadAllImages(){
  const uid = state.session.user.id;
  const results = [];
  for (const img of ficheImages) {
    if (img.file) {
      const compressed = await compressImage(img.file);
      const rawExt = (compressed.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g, "");
      const ext = rawExt || "jpg";
      const path = `${uid}/${Date.now()}_${randId()}.${ext}`;
      const { error } = await supabaseClient.storage.from("content-images").upload(path, compressed, { upsert: true });
      if (error) throw error;
      const { data } = supabaseClient.storage.from("content-images").getPublicUrl(path);
      results.push(data.publicUrl);
    } else if (img.url) {
      results.push(img.url);
    }
  }
  return results;
}

async function saveFiche(existingCard, dateStr, createNewAfter){
  const msg = document.getElementById("fiche-msg");
  msg.innerHTML = "";
  try {
    const imageUrls = await uploadAllImages();
    const payload = {
      user_id: state.session.user.id,
      card_date: dateStr,
      platform: document.getElementById("f-platform").value,
      format: document.getElementById("f-format").value,
      category: document.getElementById("f-category").value,
      post_time: document.getElementById("f-time").value || null,
      description: document.getElementById("f-desc").value.trim(),
      hashtags: document.getElementById("f-hashtags").value.trim(),
      observation: document.getElementById("f-observation").value.trim(),
      status: document.getElementById("f-status").value,
      image_urls: imageUrls,
      image_url: imageUrls[0] || null
    };

    if (existingCard) {
      const { error } = await supabaseClient.from("content_cards").update(payload).eq("id", existingCard.id);
      if (error) throw error;
    } else {
      const { error } = await supabaseClient.from("content_cards").insert(payload);
      if (error) throw error;
    }

    const removedUrls = originalImageUrls.filter(u => !imageUrls.includes(u));
    await deleteStorageImages(removedUrls);

    ficheDirtyCheck = null; // enregistré : plus rien à avertir en quittant

    if (createNewAfter) {
      location.hash = `#/fiche/nouvelle/${dateStr}`;
      route(); // hash may be identical to previous "new" route, force refresh
    } else {
      location.hash = `#/jour/${dateStr}`;
    }
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${h(err.message || String(err))}</div>`;
  }
}

function formatBytes(bytes){
  bytes = Number(bytes) || 0;
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " Ko";
  if (bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + " Mo";
  return (bytes/(1024*1024*1024)).toFixed(2) + " Go";
}

  document.getElementById("save-name-btn").addEventListener("click", async () => {
    const msg = document.getElementById("profile-msg");
    const newName = document.getElementById("p-name").value.trim();
    const { error } = await supabaseClient.from("profiles").update({ full_name: newName }).eq("id", state.session.user.id);
    if (error) { msg.innerHTML = `<div class="error-msg">${h(error.message)}</div>`; return; }
    state.profile.full_name = newName;
    msg.innerHTML = `<div class="ok-msg">Nom mis à jour.</div>`;
  });

  document.getElementById("save-social-btn").addEventListener("click", async () => {
    const msg = document.getElementById("profile-msg");
    const links = {};
    SOCIAL_LINK_PLATFORMS.forEach(p => {
      const val = document.getElementById(`p-social-${p}`).value.trim();
      if (val) links[p] = val;
    });
    const { error } = await supabaseClient.from("profiles").update({ social_links: links }).eq("id", state.session.user.id);
    if (error) { msg.innerHTML = `<div class="error-msg">${h(error.message)}</div>`; return; }
    state.profile.social_links = links;
    msg.innerHTML = `<div class="ok-msg">Réseaux sociaux mis à jour.</div>`;
  });

  document.getElementById("save-pass-btn").addEventListener("click", async () => {
    const msg = document.getElementById("profile-msg");
    const pass = document.getElementById("p-newpass").value;
    const pass2 = document.getElementById("p-newpass2").value;
    if (!pass || pass.length < 6) {
      msg.innerHTML = `<div class="error-msg">Le mot de passe doit contenir au moins 6 caractères.</div>`;
      return;
    }
    if (pass !== pass2) {
      msg.innerHTML = `<div class="error-msg">Les mots de passe ne correspondent pas.</div>`;
      return;
    }
    const { error } = await supabaseClient.auth.updateUser({ password: pass });
    if (error) { msg.innerHTML = `<div class="error-msg">${h(error.message)}</div>`; return; }
    msg.innerHTML = `<div class="ok-msg">Mot de passe mis à jour.</div>`;
    document.getElementById("p-newpass").value = "";
    document.getElementById("p-newpass2").value = "";
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    state.session = null;
    state.profile = null;
    location.hash = "#/";
    route();
  });
}
</script>
</body>
</html>
